<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - RaktSetu</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff5f5, #ffe1e1);
        }

        .login-card {
            width: 92%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            font-size: 42px;
        }

        h1 {
            text-align: center;
            margin: 8px 0;
            color: #c62828;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #c62828;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #c62828;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #a91f1f;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }

        .admin-label {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">🩸</div>

    <h1>RaktSetu</h1>

    <div class="subtitle">Administrator Login</div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label for="username">Admin Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter admin username"
            required
        >

        <label for="password">Admin Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter admin password"
            required
        >

        <button type="submit">🔐 Login to Admin Panel</button>

    </form>

    <div class="admin-label">
        Authorized administrators only
    </div>

</div>

</body>
</html>
