<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RaktSetu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            color: #d32f2f;
            margin: 5px 0;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .login-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border-radius: 10px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            color: white;
        }

        .admin-btn {
            background: #d32f2f;
        }

        .admin-btn:hover {
            background: #b71c1c;
        }

        .user-btn {
            background: #333;
        }

        .user-btn:hover {
            background: #222;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">🩸</div>

    <h1>RaktSetu</h1>

    <p>Blood Donor Finder</p>

    <a href="{{ url_for('admin_login') }}"
       class="login-btn admin-btn">
        Admin Login
    </a>

    <a href="{{ url_for('register') }}"
       class="login-btn user-btn">
        User / Donor Registration
    </a>

</div>

</body>
</html>
